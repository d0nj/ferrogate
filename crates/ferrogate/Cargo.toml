[package]
name = "ferrogate"
version.workspace = true
edition.workspace = true
description = "FerroGate - local-first AI gateway for LLM providers"
license.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace", "timeout", "compression-gzip", "limit"] }
tower = { version = "0.5", features = ["limit"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2", "charset", "system-proxy"] }
futures-util = "0.3"
tokio-stream = "0.1"
eventsource-stream = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiktoken-rs = "0.12"
governor = "0.10"
redis = { version = "1", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }
moka = { version = "0.12", features = ["future"] }
dashmap = "6"
ipnet = "2"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono", "uuid"] }
sea-orm = { version = "2", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono", "with-uuid", "with-json", "stream"] }
sea-orm-migration = { version = "2", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
async-trait = "0.1"
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
async-stream = "0.3"
regex = "1"
hmac = "0.12"
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["getrandom"] }
cookie = "0.18"
chacha20poly1305 = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

